<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { font-size: 18px; font-weight: 600; color: #1a1a1a; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mode-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #555;
            cursor: pointer;
        }

        .mode-toggle input[type="checkbox"] {
            width: 36px;
            height: 20px;
            appearance: none;
            background: #ccc;
            border-radius: 20px;
            cursor: pointer;
            position: relative;
            transition: background 0.2s;
        }

        .mode-toggle input[type="checkbox"]:checked {
            background: #1a1a1a;
        }

        .mode-toggle input[type="checkbox"]::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.2s;
        }

        .mode-toggle input[type="checkbox"]:checked::after {
            left: 18px;
        }

        #upload-btn, #new-chat-btn {
            background: none;
            border: 1px solid #e0e0e0;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #555;
        }

        #upload-btn:hover, #new-chat-btn:hover { background: #f5f5f5; }

        #pdf-status {
            font-size: 13px;
            color: #0a7d3a;
            background: #e8f7ed;
            padding: 6px 12px;
            border-radius: 8px;
            display: none;
            align-items: center;
            gap: 6px;
        }

        #pdf-status.active { display: flex; }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .user {
            background: #1a1a1a;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .assistant {
            background: #fff;
            color: #1a1a1a;
            align-self: flex-start;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .source-badge {
            font-size: 11px;
            background: #f0f0f0;
            color: #555;
            padding: 2px 8px;
            border-radius: 20px;
            margin-bottom: 6px;
            display: inline-block;
        }

        #input-area {
            background: #fff;
            border-top: 1px solid #e0e0e0;
            padding: 16px 24px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        #message-input {
            flex: 1;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 15px;
            resize: none;
            outline: none;
            max-height: 120px;
            font-family: inherit;
        }

        #message-input:focus { border-color: #1a1a1a; }

        #send-btn {
            background: #1a1a1a;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            white-space: nowrap;
        }

        #send-btn:hover { background: #333; }
        #send-btn:disabled { background: #ccc; cursor: not-allowed; }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
            gap: 8px;
        }

        .empty-state h2 { font-size: 20px; color: #555; }
        .empty-state p { font-size: 14px; }

        #file-input { display: none; }
    </style>
</head>
<body>
    <header>
        <h1>AI Chat Assistant</h1>
        <div class="header-right">
            <div id="pdf-status">
                <span id="pdf-filename"></span>
            </div>
            <label class="mode-toggle">
               <input type="checkbox" id="wiki-toggle" onchange="handleWikiToggle(this.checked)">
                Wikipedia
            </label>
            <input type="file" id="file-input" accept=".pdf" onchange="handleFileUpload(event)">
            <button id="upload-btn" onclick="document.getElementById('file-input').click()">Upload PDF</button>
            <button id="new-chat-btn" onclick="newChat()">New chat</button>
        </div>
    </header>

    <div id="chat-window">
        <div class="empty-state" id="empty-state">
            <h2>How can I help you?</h2>
            <p>Send a message, toggle Wikipedia mode, or upload a PDF</p>
        </div>
    </div>

    <div id="input-area">
        <textarea
            id="message-input"
            placeholder="Type a message..."
            rows="1"
            onkeydown="handleKey(event)"
            oninput="autoResize(this)"
        ></textarea>
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        let sessionId = null;
        let isStreaming = false;
        let docId = null;

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }
        function handleWikiToggle(checked) {
    if (checked && docId) {
        docId = null;
        document.getElementById('pdf-status').classList.remove('active');
    }
}
        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusEl = document.getElementById('pdf-status');
            const filenameEl = document.getElementById('pdf-filename');
            filenameEl.textContent = 'Indexing ' + file.name + '...';
            statusEl.classList.add('active');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload-pdf', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                docId = data.doc_id;
                filenameEl.textContent = data.filename + ' (' + data.chunks_indexed + ' chunks)';
                document.getElementById('wiki-toggle').checked = false;
            } catch (err) {
                filenameEl.textContent = 'Upload failed';
            }
        }

        function addMessage(role, text, sourceLabel = null) {
            const emptyState = document.getElementById('empty-state');
            if (emptyState) emptyState.remove();

            const div = document.createElement('div');
            div.className = `message ${role}`;

            if (sourceLabel && role === 'assistant') {
                const badge = document.createElement('div');
                badge.className = 'source-badge';
                badge.textContent = sourceLabel;
                div.appendChild(badge);
            }

            const textDiv = document.createElement('div');
            textDiv.textContent = text;
            div.appendChild(textDiv);

            const chatWindow = document.getElementById('chat-window');
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return textDiv;
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            const useWiki = document.getElementById('wiki-toggle').checked;
            if (!message || isStreaming) return;

            input.value = '';
            input.style.height = 'auto';
            isStreaming = true;
            document.getElementById('send-btn').disabled = true;

            addMessage('user', message);

            let sourceLabel = null;
            if (docId) sourceLabel = 'PDF document';
            else if (useWiki) sourceLabel = 'Wikipedia';

            const assistantTextDiv = addMessage('assistant', 'Thinking...', sourceLabel);
            assistantTextDiv.style.opacity = '0.5';
            assistantTextDiv.style.fontStyle = 'italic';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message,
                        session_id: sessionId,
                        use_wiki: useWiki,
                        doc_id: docId
                    })
                });

                sessionId = response.headers.get('x-session-id');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';

                assistantTextDiv.style.opacity = '1';
                assistantTextDiv.style.fontStyle = 'normal';
                assistantTextDiv.textContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    fullText += decoder.decode(value, { stream: true });
                    assistantTextDiv.textContent = fullText;
                    document.getElementById('chat-window').scrollTop =
                        document.getElementById('chat-window').scrollHeight;
                }

            } catch (err) {
                assistantTextDiv.textContent = 'Something went wrong. Please try again.';
            } finally {
                isStreaming = false;
                document.getElementById('send-btn').disabled = false;
                document.getElementById('message-input').focus();
            }
        }

        function newChat() {
            sessionId = null;
            docId = null;
            document.getElementById('pdf-status').classList.remove('active');
            document.getElementById('wiki-toggle').checked = false;
            const chatWindow = document.getElementById('chat-window');
            chatWindow.innerHTML = `
                <div class="empty-state" id="empty-state">
                    <h2>How can I help you?</h2>
                    <p>Send a message, toggle Wikipedia mode, or upload a PDF</p>
                </div>`;
        }
    </script>
</body>
</html>
